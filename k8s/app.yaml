# ==================== RAFT NODE A ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raft-node-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raft-node-a
  template:
    metadata:
      labels:
        app: raft-node-a
    spec:
      containers:
        - name: raft-node-a
          image: hospital-backend:v5
          imagePullPolicy: IfNotPresent
          command: ["python", "raft_node.py", "A"]
          ports:
            - containerPort: 60401
---
apiVersion: v1
kind: Service
metadata:
  name: raft-node-a
spec:
  selector:
    app: raft-node-a
  ports:
    - port: 60401
      targetPort: 60401

